<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>precision describer teach mode</title>
<style>
  :root {
    --bg: #f6f1e8;
    --panel: #fffaf2;
    --ink: #1f1c18;
    --muted: #6c6257;
    --line: #d7ccbd;
    --mark: #ffd76a;
    --mark-2: #ffc34d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 16px/1.5 Georgia, serif;
    color: var(--ink);
    background:
      radial-gradient(circle at top left, #fff7d8, transparent 22rem),
      linear-gradient(180deg, #f5efe6, #efe7da);
  }
  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 24px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 1.5rem;
  }
  p { color: var(--muted); }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 10px 30px rgba(61, 43, 22, 0.08);
  }
  textarea {
    width: 100%;
    min-height: 240px;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--ink);
    background: #fffdf9;
    resize: vertical;
  }
  button {
    margin: 12px 0 0;
    border: 0;
    border-radius: 999px;
    padding: 10px 14px;
    font: inherit;
    color: #fff;
    background: #6a3b00;
    cursor: pointer;
  }
  #output {
    margin-top: 16px;
    white-space: pre-wrap;
    font-size: 1.05rem;
  }
  mark {
    padding: 0 .12em;
    border-radius: .25em;
    background: linear-gradient(180deg, var(--mark), var(--mark-2));
    cursor: pointer;
  }
  #note {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    min-height: 4.5em;
  }
  #note strong {
    display: block;
    color: var(--ink);
  }
  .error {
    color: #8a1f11;
  }
</style>
<main>
  <div class="card">
    <h1>teach mode: agent annotation viewer</h1>
    <p>paste agent output as JSON, or open this page with <code>#data=...</code>. the page only renders spans the agent already decided on.</p>
    <textarea id="payload">{
  "text": "Three curious collaborators rapidly exploring an idea about AI systems that improve how humans describe things.",
  "annotations": [
    {
      "start": 6,
      "end": 13,
      "label": "curious",
      "why": "interpretive and generic",
      "try": "replace with the behavior that made you infer curiosity"
    },
    {
      "start": 28,
      "end": 45,
      "label": "rapidly exploring",
      "why": "abstract process wording",
      "try": "say how they are exploring: iterating, revising, combining"
    },
    {
      "start": 71,
      "end": 110,
      "label": "that improve how humans describe things",
      "why": "broad and underspecified",
      "try": "name the improvement directly: more precise, audience-aware, context-aware"
    }
  ]
}</textarea>
    <button id="render">render agent output</button>
    <div id="output"></div>
    <div id="note"><strong>click a highlight</strong>the note for that span will appear here.</div>
  </div>
</main>
<script>
  const payload = document.getElementById("payload");
  const output = document.getElementById("output");
  const note = document.getElementById("note");

  function escapeHtml(text) {
    return text.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  function loadHash() {
    if (!location.hash.startsWith("#data=")) return;
    try {
      payload.value = decodeURIComponent(location.hash.slice(6));
    } catch {
      note.innerHTML = '<strong class="error">invalid hash payload</strong>could not decode <code>#data=</code>.';
    }
  }

  function render() {
    let data;
    try {
      data = JSON.parse(payload.value);
    } catch (error) {
      output.textContent = "";
      note.innerHTML = `<strong class="error">invalid json</strong>${escapeHtml(error.message)}`;
      return;
    }
    const text = String(data.text ?? "");
    const annotations = Array.isArray(data.annotations) ? [...data.annotations] : [];
    annotations.sort((a, b) => a.start - b.start || a.end - b.end);
    let html = "";
    let cursor = 0;
    for (let i = 0; i < annotations.length; i += 1) {
      const item = annotations[i];
      if (!Number.isInteger(item.start) || !Number.isInteger(item.end) || item.start < cursor || item.end > text.length || item.start >= item.end) {
        output.textContent = "";
        note.innerHTML = "<strong class=\"error\">invalid annotation</strong>spans must be ordered, non-overlapping, and inside the source text.";
        return;
      }
      html += escapeHtml(text.slice(cursor, item.start));
      html += `<mark data-i="${i}">${escapeHtml(text.slice(item.start, item.end))}</mark>`;
      cursor = item.end;
    }
    output.innerHTML = html + escapeHtml(text.slice(cursor));
    output.querySelectorAll("mark").forEach(el => {
      el.onclick = () => {
        const item = annotations[Number(el.dataset.i)];
        note.innerHTML =
          `<strong>${escapeHtml(item.label || text.slice(item.start, item.end))}</strong>` +
          `why it weakens precision: ${escapeHtml(item.why || "not provided")}<br>` +
          `try instead: ${escapeHtml(item.try || "not provided")}`;
      };
    });
    note.innerHTML = annotations.length
      ? "<strong>click a highlight</strong>the note for that span will appear here."
      : "<strong>no annotations</strong>the agent payload did not include any spans to render.";
  }

  document.getElementById("render").onclick = render;
  loadHash();
  render();
</script>
</html>
